<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>Projets - Mon_portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-enter">
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="bg-vignette" aria-hidden="true"></div>
    <div class="page-transition" aria-hidden="true"></div>

    <header class="header">
      <div class="brand" aria-label="Marque">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">TIA ROMARIC BONAVENTURE EVRA</span>
      </div>

      <button id="menuBtn" class="icon-btn" aria-label="Ouvrir le menu" aria-controls="nav" aria-expanded="false" type="button">
        <span class="burger" aria-hidden="true"></span>
      </button>

      <nav id="nav" class="nav" aria-label="Navigation principale">
        <a class="nav-link" href="index.html">Accueil</a>
        <a class="nav-link" href="about.html">À propos</a>
        <a class="nav-link" href="projets.html">Projets</a>
        <a class="nav-link" href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="main">
      <section id="projets" class="section projects">
        <div class="section-head" data-reveal="up">
          <h2 class="section-title">Projets</h2>
          <p class="section-subtitle">Clique sur un projet pour ouvrir une fiche avec détails et actions.</p>
        </div>

        <div class="projects-grid">
          <button class="project-card" type="button" data-project="0" data-reveal="up">
            <div class="project-media" aria-hidden="true"></div>
            <div class="project-body">
              <div class="project-top">
                <div class="project-tag">UI/UX</div>
                <div class="project-badge">Web</div>
              </div>
              <div class="project-title">Logiciel de gestion de stock</div>
              <div class="project-desc">page de connexion + tableau de bord </div>
              <div class="project-cta">Ouvrir</div>
            </div>
          </button>

          <button class="project-card" type="button" data-project="1" data-reveal="up">
            <div class="project-media media-2" aria-hidden="true"></div>
            <div class="project-body">
              <div class="project-top">
                <div class="project-tag">Performance</div>
                <div class="project-badge">Rapide</div>
              </div>
              <div class="project-title">Gestionnaire des salles de classes et des professeurs</div>
              <div class="project-desc">Application web pour la gestion des salles et des professeurs.</div>
              <div class="project-cta">Ouvrir</div>
            </div>
          </button>

          <button class="project-card" type="button" data-project="2" data-reveal="up">
            <div class="project-media media-3" aria-hidden="true"></div>
            <div class="project-body">
              <div class="project-top">
                <div class="project-tag">UI/UX</div>
                <div class="project-badge">Soigné</div>
              </div>
              <div class="project-title">Formulaire stylé</div>
              <div class="project-desc">Labels flottants, validation et toast de confirmation.</div>
              <div class="project-cta">Ouvrir</div>
            </div>
          </button>
        </div>

        <div id="projectModal" class="modal" aria-hidden="true">
          <div class="modal-scrim" data-close="true" aria-hidden="true"></div>
          <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-head">
              <div class="modal-title-wrap">
                <div class="modal-pill" id="modalTag" aria-hidden="true"></div>
                <h3 id="modalTitle" class="modal-title">Titre</h3>
              </div>
              <button class="icon-btn icon-btn-small" id="modalClose" type="button" aria-label="Fermer la modale">
                <span aria-hidden="true">✕</span>
              </button>
            </div>

            <p id="modalDesc" class="modal-desc"></p>

            <div class="modal-list" id="modalList" aria-label="Points clés"></div>

            <div class="modal-actions">
              <a class="btn btn-primary" href="#" id="modalPrimary" data-ripple>Voir la démo</a>
              <a class="btn btn-ghost" href="#" id="modalSecondary" data-ripple>Voir le projet</a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <span>© <span id="year"></span>Tia Romaric</span>
        <span class="footer-sep" aria-hidden="true">•</span>
        <span>Tous droits réservés</span>
      </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="app.js" defer></script>
  </body>
</html>
