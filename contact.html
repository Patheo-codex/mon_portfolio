<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>Contact - Mon_portfolio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-enter">
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="bg-vignette" aria-hidden="true"></div>
    <div class="page-transition" aria-hidden="true"></div>

    <header class="header">
      <div class="brand" aria-label="Marque">
        <span class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">TIA ROMARIC BONAVENTURE EVRA</span>
      </div>

      <button id="menuBtn" class="icon-btn" aria-label="Ouvrir le menu" aria-controls="nav" aria-expanded="false" type="button">
        <span class="burger" aria-hidden="true"></span>
      </button>

      <nav id="nav" class="nav" aria-label="Navigation principale">
        <a class="nav-link" href="index.html">Accueil</a>
        <a class="nav-link" href="about.html">À propos</a>
        <a class="nav-link" href="projets.html">Projets</a>
        <a class="nav-link" href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="main">
      <section id="contact" class="section contact">
        <div class="section-head" data-reveal="up">
          <h2 class="section-title">Contact</h2>
          <p class="section-subtitle">Écris-moi, ou télécharge mon CV.</p>
        </div>

        <div class="contact-grid">
          <div class="contact-panel" data-reveal="left">
            <form id="contactForm" class="form" autocomplete="on">
              <label class="field">
                <input id="name" name="name" type="text" placeholder=" " required maxlength="60" />
                <span>Nom</span>
              </label>

              <label class="field">
                <input id="email" name="email" type="email" placeholder=" " required maxlength="80" />
                <span>Email</span>
              </label>

              <label class="field">
                <textarea id="message" name="message" placeholder=" " required maxlength="600" rows="5"></textarea>
                <span>Message</span>
              </label>

              <button class="btn btn-primary btn-block" id="submitBtn" type="submit" data-ripple>
                Envoyer
                <span class="btn-loader" aria-hidden="true"></span>
              </button>

              <p class="form-hint">
                Sinon: <a href="mailto:romarictia95@gmail.com" id="mailtoLink">romarictia95@gmail.com</a>
              </p>
            </form>
          </div>

          <div class="contact-panel contact-side" data-reveal="right">
            <div class="contact-card">
              <div class="contact-card-title">Télécharger mon CV</div>
              <a class="btn btn-ghost btn-block" href="dossier/TIA ROMARIC.pdf" download id="cvMain" data-ripple>
                CV.pdf
              </a>

              <div class="contact-card-divider" aria-hidden="true"></div>

              <div class="contact-card-title">Réseaux</div>
              <div class="socials">
                <a class="social-btn" href="https://github.com/Patheo-codex" target="_blank" rel="noopener noreferrer" data-ripple aria-label="Lien GitHub">
                  GitHub
                </a>
                <a class="social-btn" href="https://wa.me/2250767017595?texte=Bonjour%20merci%20de%20me%20contacter" data-ripple aria-label="Lien Portfolio">
                  WhatsApp
                </a>
              </div>

              <div class="contact-card-note">
                <span class="contact-star" aria-hidden="true"></span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="footer-inner">
        <span>© <span id="year"></span>Tia Romaric</span>
        <span class="footer-sep" aria-hidden="true">•</span>
        <span>Tous droits réservés</span>
      </div>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="app.js" defer></script>
  </body>
</html>
